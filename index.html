<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var force = q.get('intro') === '1';
    var skip = q.get('intro') === '0' || location.hash.indexOf('#s=') === 0 || q.get('vigil') || q.get('q');
    var seen = false;
    try { seen = localStorage.getItem('kauffmann.introSeen') === '1'; } catch (e) {}
    if ((seen && !force) || skip) document.documentElement.classList.add('intro-skip');
  })();
</script>

<body class="dark">
<header class="top">
  <div class="brand">
    <span class="plate" aria-hidden="true"></span>
    <div>
      <h1 data-i18n="title">Lista Kauffmann</h1>
      <p class="sub" data-i18n="subtitle">Stolpersteine en Alemania · Un nombre, una vida.</p>
    </div>
  </div>
  <div class="topright">
    <button id="remember" class="remember" data-i18n="remember">Recordar a todos</button>
    <nav class="lang" aria-label="Idioma / Sprache / Language">
      <button data-lang="es">ES</button><button data-lang="de">DE</button><button data-lang="en">EN</button>
    </nav>
  </div>
</header>

<main class="layout">
  <aside class="side" id="side">
    <div class="search">
      <label for="q" class="vh" data-i18n="searchLabel">Buscar</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh" placeholder="Nombre, apellido o dirección…">
      <div class="filters">
        <label for="city" class="vh" data-i18n="cityLabel">Lugar</label>
        <input id="city" list="cities" autocomplete="off" data-i18n-ph="cityPh" placeholder="Filtrar por lugar (opcional)">
        <datalist id="cities"></datalist>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </div>
    <ol id="results" class="results"></ol>
    <article id="detail" class="detail" hidden></article>
  </aside>
  <div class="mapwrap">
    <div id="map" class="map" role="region" aria-label="Mapa 3D"></div>
    <div id="mapHist" class="maphist" hidden></div>
    <div id="aerialHud" class="aerial-hud" hidden>
      <p id="hoyHint" class="hoy-hint"></p>
      <div id="epochToggle" class="epoch-toggle" role="group" aria-label="1945 / Hoy"></div>
    </div>
    <div id="swipe" class="swipe" hidden>
      <span class="swipe-tag" id="swipeTagL">1945</span>
      <span class="swipe-tag swipe-tag-r" id="swipeTagR">Hoy</span>
      <div class="swipe-line" id="swipeLine"></div>
      <button type="button" id="swipeHandle" class="swipe-handle" aria-label="Comparar 1945 y hoy"></button>
    </div>
    <p id="imgCredit" class="imgcredit" hidden></p>
    <div class="basemaps" role="group" aria-label="Mapa base">
      <button data-base="night" data-i18n="baseNight">Noche</button>
      <button data-base="day" data-i18n="baseDay">Día</button>
      <button data-base="hoy" data-i18n="baseHoy">Hoy</button>
      <button data-base="sat" data-i18n="baseSat" title="Sentinel-2, 2016, vista general">2016</button>
      <button type="button" id="sourcesBtn" data-i18n="sourcesBtn">Fuentes</button>
    </div>
    <div id="vigil" class="vigil" hidden>
      <p class="vigil-count" id="vigilCount"></p>
      <p class="vigil-text" id="vigilText"></p>
      <p class="vigil-place" id="vigilPlace"></p>
      <p class="vigil-names" id="vigilNames" aria-live="off"></p>
      <div class="vigil-actions">
        <button id="vigilPause" data-i18n="pause">Pausar</button>
        <button id="vigilExit" data-i18n="exit">Salir</button>
      </div>
    </div>
    <div id="nogl" class="nogl" hidden></div>
  </div>
</main>

<footer class="foot">
  <p data-i18n-html="attribution3d"></p>
  <p><a href="2d/" data-i18n="classic">Mapa clásico 2D</a> · <a href="proyecto/" data-i18n="project">Sobre el proyecto</a> · <a href="#" id="aboutLink" data-i18n="about">Acerca de los datos</a> · <button type="button" id="replayIntro" class="linkish" data-i18n="replay">Introducción</button></p>
</footer>

<dialog id="about" class="about">
  <div id="aboutBody"></div>
  <div class="actions">
    <button type="button" id="dlGeo" data-i18n="dlGeo">Descargar GeoJSON</button>
    <button type="button" id="dlKml" data-i18n="dlKml">Descargar KML</button>
  </div>
  <form method="dialog"><button data-i18n="close">Cerrar</button></form>
</dialog>
<dialog id="contribDlg" class="about"><p id="contribNote"></p><form method="dialog"><button data-i18n="close">Cerrar</button></form></dialog>
<dialog id="sourcesDlg" class="about sources-dlg">
  <div id="sourcesBody"></div>
  <form method="dialog"><button type="submit" id="sourcesClose" data-i18n="close">Cerrar</button></form>
</dialog>

<div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <button type="button" id="introSkip" class="intro-skip-btn">Omitir</button>
  <div class="intro-lower">
    <p class="intro-kicker">Lista Kauffmann</p>
    <h2 id="introTitle">Cada placa, cada nombre, cada historia.</h2>
    <p id="introBody">Nunca olvidar.</p>
    <div class="intro-nav">
      <div class="intro-dots" id="introDots"></div>
      <button type="button" id="introNext" class="intro-next">Continuar</button>
    </div>
  </div>
</div>
