# Genera los datos (pipeline/) y publica el sitio completo en GitHub Pages.
# Los datos generados (api/, data/search/, llms.txt, .well-known/) NO se guardan en el repo:
# se crean aquí en cada publicación. Requiere: Settings → Pages → Source = "GitHub Actions".
name: Publicar sitio y datos

# Solo se publica a mano y con el OK de Carlos (Actions → «Publicar sitio y datos» → Run workflow,
# o `gh workflow run publicar.yml`). Sin publicación automática por push ni por calendario.
# Para refrescar Wikidata, basta con lanzar este mismo workflow a mano.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semana actual (clave de caché)
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Caché de respuestas de Wikidata: dura una semana, así un push no repite 90 min de consultas.
      - uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ steps.week.outputs.w }}

      # Solo para comprobar el OpenAPI (versiones fijadas); el pipeline no las usa.
      - name: Instalar el validador de OpenAPI (fijado)
        run: python3 -m pip install -r tests/requirements-ci.txt

      - name: Tests
        run: python3 -m unittest discover -s pipeline/tests -t .

      - name: Generar datos
        # --strict: si una fuente falla no se publica nada y sigue en línea la versión anterior.
        run: python3 -m pipeline build --strict --sources stolpersteine_de,wikidata_holocaust_victims,berlin_opendata,koeln_opendata

      - name: Validar
        run: python3 -m pipeline validate

      # Puerta para IA: enlaces, OpenAPI, coherencia de find/ con las fichas y una IA simulada
      # que busca 10 personas por nombre/ciudad solo con los archivos públicos y las cita.
      - name: Comprobar la puerta para IA
        env:
          REQUIRE_OAV: "1"          # sin el validador instalado, la comprobación falla en vez de saltarse el OpenAPI
        run: |
          python3 tests/ai-door-check.py
          python3 tests/ai-sim.py . --n 10 --seed 1

      # Versión única: ?v= de index.html, VERSION del service worker y huellas de JS/CSS deben coincidir
      # (si cambió un archivo de la app sin `python3 tests/bump-version.py`, los teléfonos verían la versión vieja).
      - name: Comprobar la versión de la app
        run: node tests/version-test.cjs

      - name: Montar el sitio
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                   --exclude 'pipeline' --exclude 'docs' --exclude 'tests' --exclude 'contador' --exclude '__pycache__' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
